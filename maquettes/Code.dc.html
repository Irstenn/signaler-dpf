<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signaler-DPF — Code à usage unique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF1EF}
a{color:#1A5A85}a:hover{color:#0F3D5C}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:10px;font-weight:600;font-size:16px;text-decoration:none;border:1px solid transparent}
.btn-p{background:#1A5A85;color:#fff}.btn-p:hover{background:#0F3D5C;color:#fff}
.digit{box-sizing:border-box;width:100%;height:58px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:24px;border:1px solid #7D8A91;border-radius:10px;background:#fff;color:#13212B}
</style>

<style>
body{background:#DCE2E5}
#dc-root{display:flex;justify-content:center;min-height:100vh}
#dc-root>div{height:auto!important;min-height:100vh;box-shadow:0 0 0 1px #C9D1D5,0 8px 40px rgba(19,33,43,.12)}
@media (max-width:440px){#dc-root>div{width:100%!important;box-shadow:none}}
</style>
<script src="./dc-lite.js"></script>
</head>
<body>
<template id="dc-template">

<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;color:#13212B;background:#F6F8F7">
<header style="padding:16px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #DCE2E5;background:#fff">
<a href="Main.dc.html" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:500;text-decoration:none">
<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"></path></svg>Modifier l’adresse</a>
</header>
<main style="flex:1;padding:32px 20px;display:flex;flex-direction:column;gap:24px">
<div style="width:56px;height:56px;border-radius:14px;background:#E3EEF6;display:flex;align-items:center;justify-content:center">
<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1A5A85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="margin:0;font-size:26px;font-weight:600">Saisissez votre code</h1>
<p style="margin:0;font-size:16px;line-height:1.5;color:#3E4B53">Un code à 6 chiffres vient d’être envoyé à <strong style="color:#13212B">camille.martin@vnf.fr</strong>. Il n’est valable qu’une fois.</p>
</div>
<fieldset style="border:0;margin:0;padding:0">
<legend style="font-size:14px;font-weight:600;margin-bottom:10px;padding:0">Code à usage unique</legend>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
<input class="digit" inputmode="numeric" maxlength="1" aria-label="Chiffre 1" value="4">
<input class="digit" inputmode="numeric" maxlength="1" aria-label="Chiffre 2" value="8">
<input class="digit" inputmode="numeric" maxlength="1" aria-label="Chiffre 3" value="1">
<input class="digit" inputmode="numeric" maxlength="1" aria-label="Chiffre 4">
<input class="digit" inputmode="numeric" maxlength="1" aria-label="Chiffre 5">
<input class="digit" inputmode="numeric" maxlength="1" aria-label="Chiffre 6">
</div>
</fieldset>
<a class="btn btn-p" href="Signalement.dc.html">Me connecter</a>
<div style="display:flex;flex-direction:column;gap:6px;font-size:14px;color:#56636B">
<span>Code expiré dans [DURÉE DE VALIDITÉ].</span>
<a href="#" style="font-weight:600">Renvoyer un code</a>
</div>
</main>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
