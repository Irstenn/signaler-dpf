<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signaler-DPF — Connexion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF1EF}
a{color:#1A5A85}a:hover{color:#0F3D5C}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#13212B}
.in{box-sizing:border-box;width:100%;min-height:48px;padding:10px 12px;border:1px solid #7D8A91;border-radius:8px;font:inherit;font-size:16px;color:#13212B;background:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:10px;font-weight:600;font-size:16px;text-decoration:none;border:1px solid transparent}
.btn-p{background:#1A5A85;color:#fff}.btn-p:hover{background:#0F3D5C;color:#fff}
.role{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #C9D1D5;border-radius:10px;background:#fff;cursor:pointer}
.role:has(input:checked){border:2px solid #1A5A85;padding:13px;background:#F1F6FA}
.role input{margin:3px 0 0;width:20px;height:20px;accent-color:#1A5A85}
</style>

<style>
body{background:#DCE2E5}
#dc-root{display:flex;justify-content:center;min-height:100vh}
#dc-root>div{height:auto!important;min-height:100vh;box-shadow:0 0 0 1px #C9D1D5,0 8px 40px rgba(19,33,43,.12)}
@media (max-width:440px){#dc-root>div{width:100%!important;box-shadow:none}}
</style>
<script src="./dc-lite.js"></script>
</head>
<body>
<template id="dc-template">

<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;color:#13212B;background:#F6F8F7">
<header style="background:#13212B;color:#fff;padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;gap:10px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#7FC1E8" stroke-width="2.2" stroke-linecap="round"><path d="M3 10c3-3 5-3 8 0s5 3 8 0 5-3 6-1"></path><path d="M3 17c3-3 5-3 8 0s5 3 8 0 5-3 6-1"></path></svg>
<div style="display:flex;flex-direction:column">
<span style="font-weight:700;font-size:18px">signaler-dpf</span>
<span style="font-size:12px;color:#C3CED4">Domaine public fluvial · Seine-Nord</span>
</div>
</div>
<h1 style="margin:0;font-size:26px;line-height:1.2;font-weight:600">Signaler, instruire et suivre les anomalies sur le DPF</h1>
</header>
<main style="flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:22px">
<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">
<legend style="font-size:14px;font-weight:600;margin-bottom:10px;padding:0">Je me connecte en tant que</legend>
<label class="role"><input type="radio" name="profil" checked>
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:16px">Agent VNF</span><span style="font-size:14px;color:#56636B">Signaler une anomalie constatée sur le terrain</span></span></label>
<label class="role"><input type="radio" name="profil">
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:16px">Gestionnaire du domaine</span><span style="font-size:14px;color:#56636B">Caractériser et instruire les dossiers</span></span></label>
<label class="role"><input type="radio" name="profil">
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:16px">Agent du BAJC</span><span style="font-size:14px;color:#56636B">Documenter la phase judiciaire</span></span></label>
</fieldset>
<div>
<label class="lbl" for="mail">Adresse électronique VNF</label>
<input class="in" id="mail" type="email" placeholder="prenom.nom@vnf.fr" autocomplete="email">
</div>
<a class="btn btn-p" href="Code.dc.html">Recevoir mon code</a>
<p style="margin:0;font-size:14px;line-height:1.5;color:#56636B">Ni mot de passe, ni création de compte : un code à usage unique vous est envoyé par courriel.</p>
</main>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
