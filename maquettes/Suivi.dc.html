class Component extends DCLogic {
renderVals() {
const readMail = () => { try { return localStorage.getItem('dpf_email') || ''; } catch (e) { return ''; } };
const mail = readMail() || 'prenom.nom@vnf.fr';
const nom = (readMail().split('@')[0] || 'prenom.nom').split(/[._-]+/).filter(Boolean).map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
return { mail };
}
}
