<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signaler-DPF — Phase 6, tribunal et suites (BAJC)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF1EF}
a{color:#1A5A85}a:hover{color:#0F3D5C}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#13212B}
.in{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #7D8A91;border-radius:8px;font:inherit;font-size:15px;color:#13212B;background:#fff}
.in[readonly]{background:#F1F4F5;border-color:#C9D1D5}
.in:disabled{background:#F1F4F5;border-color:#D5DBDE;color:#56636B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:8px;font:inherit;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-p{background:#1A5A85;color:#fff}.btn-p:hover{background:#0F3D5C;color:#fff}
.btn-p:disabled{background:#C9D1D5;color:#3E4B53;cursor:not-allowed}
.card{background:#fff;border:1px solid #DCE2E5;border-radius:12px;padding:22px}
.mono{font-family:'IBM Plex Mono',monospace}
.k{font-size:13px;color:#56636B}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #C9D1D5;border-radius:8px;background:#F8FAFA;font-size:14px}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:1.5px dashed #7D8A91;border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:#1A5A85;cursor:pointer}
</style>
<script src="./dc-lite.js"></script>
</head>
<body>
<template id="dc-template">

<div style="min-height:100vh;font-family:'IBM Plex Sans',sans-serif;color:#13212B;background:#EEF1EF">
<header style="background:#13212B;color:#fff">
<div style="max-width:1360px;margin:0 auto;padding:8px 24px;min-height:60px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px">
<div style="display:flex;align-items:center;gap:10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="#7FC1E8" stroke-width="2.4" stroke-linecap="round"><path d="M3 10c3-3 5-3 8 0s5 3 8 0 5-3 6-1"></path><path d="M3 17c3-3 5-3 8 0s5 3 8 0 5-3 6-1"></path></svg>
<span style="font-weight:700;font-size:17px">signaler-dpf</span>
<span style="font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;background:#3B2A55;color:#E9DDF7">Espace BAJC</span>
</div>
<div style="margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px">
<div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-weight:600">Antoine Roux</span><span style="color:#C3CED4;font-size:12px">Agent du BAJC</span></div>
<div aria-hidden="true" style="width:36px;height:36px;border-radius:50%;background:#C9B6E4;color:#13212B;display:flex;align-items:center;justify-content:center;font-weight:700">AR</div>
</div>
</div>
</header>
<div style="max-width:1360px;margin:0 auto;padding:24px 24px 48px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start">
<nav aria-labelledby="liste" style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px">
<h2 id="liste" style="margin:0 0 4px;font-size:16px;font-weight:600">Dossiers au BAJC</h2>
<a href="#" aria-current="page" style="text-decoration:none;color:#13212B;background:#fff;border:2px solid #1A5A85;border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:4px">
<span class="mono" style="font-size:13px">CST-2026-0054</span><span style="font-weight:600">Rejet non autorisé</span><span class="k">Jugement attendu</span></a>
<a href="#" style="text-decoration:none;color:#13212B;background:#fff;border:1px solid #DCE2E5;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px">
<span class="mono" style="font-size:13px">CST-2026-0071</span><span style="font-weight:600">Stockage de matériaux sur le quai</span><span style="font-size:13px;font-weight:600;color:#8A3B05">Projet de PV à relire · 22 j</span></a>
<a href="#" style="text-decoration:none;color:#13212B;background:#fff;border:1px solid #DCE2E5;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px">
<span class="mono" style="font-size:13px">CST-2026-0039</span><span style="font-weight:600">Ponton commercial sans titre</span><span class="k">Notification du jugement à faire</span></a>
</nav>
<main style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px">
<span class="mono" style="font-size:16px;padding:4px 10px;border-radius:6px;background:#E3E8EA">CST-2026-0054</span>
<h1 style="margin:0;font-size:28px;font-weight:600">Rejet non autorisé</h1>
<span style="font-size:14px;color:#3E4B53">Rivière Oise canalisée · PV <span class="mono">PV-2026-0007</span> notifié le 21/08/2026 (pli délivré)</span>
</div>
<ol aria-label="Phases du processus" style="list-style:none;margin:0;padding:16px 18px;background:#fff;border:1px solid #DCE2E5;border-radius:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px">
<template data-scfor list="{{steps}}" as="s" hint-placeholder-count="6">
<li style="display:flex;flex-direction:column;gap:6px" aria-current="{{s.aria}}">
<div style="{{s.bar}}"></div>
<span style="font-size:12px;color:#56636B">Phase {{s.n}} · {{s.state}}</span>
<span style="{{s.labelStyle}}">{{s.label}}</span>
</li>
</template>
</ol>
<section class="card" aria-labelledby="pieces" style="display:flex;flex-direction:column;gap:12px">
<h2 id="pieces" style="margin:0;font-size:16px;font-weight:600">Pièces transmises par le pôle domaine</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">
<a class="file" href="#">PV signé · PV-2026-0007.pdf</a>
<a class="file" href="#">Notification du PV.pdf</a>
<a class="file" href="#">Preuve d’envoi RAR.pdf</a>
</div>
</section>
<section class="card" aria-labelledby="s1" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
<span class="num" style="background:#1A5A85;color:#fff">✓</span>
<h2 id="s1" style="margin:0;font-size:18px;font-weight:600;flex:1">Saisine du tribunal</h2>
<span style="font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#DCE7F0;color:#0F3D5C">Validée le 12/09/2026 par Antoine Roux</span>
</div>
<div style="max-width:320px"><label class="lbl" for="dsai">Date de saisine du tribunal</label><input class="in" id="dsai" type="date" value="2026-09-12" readonly></div>
</section>
<section class="card" aria-labelledby="s2" style="display:flex;flex-direction:column;gap:16px;border:2px solid #1A5A85">
<div style="display:flex;align-items:center;gap:12px">
<span class="num" style="background:#E08A2E;color:#13212B">2</span>
<h2 id="s2" style="margin:0;font-size:18px;font-weight:600">Jugement</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start">
<div><label class="lbl" for="djug">Date du jugement</label><input class="in" id="djug" type="date"></div>
<div><span class="lbl">Jugement (PDF)</span><label class="drop">Déposer le jugement<input type="file" accept="application/pdf" style="position:absolute;width:1px;height:1px;opacity:0"></label></div>
</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-top:6px;border-top:1px solid #E3E8EA">
<button type="button" class="btn btn-p">VNF est en possession du jugement</button>
<span class="k">Attribue un n° de jugement (JUG-2026-00xx) et informe la BALU du pôle domaine.</span>
</div>
</section>
<section class="card" aria-labelledby="s3" style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px">
<span class="num" style="background:#E3E8EA;color:#3E4B53">3</span>
<h2 id="s3" style="margin:0;font-size:18px;font-weight:600">Notification du jugement</h2>
</div>
<div style="max-width:320px"><label class="lbl" for="dnot">Date de notification du jugement</label><input class="in" id="dnot" type="date" disabled></div>
<div><button type="button" class="btn btn-p" disabled>Le jugement a bien été notifié au contrevenant</button></div>
</section>
<section class="card" aria-labelledby="journal" style="display:flex;flex-direction:column;gap:12px">
<h2 id="journal" style="margin:0;font-size:16px;font-weight:600">Journal du dossier</h2>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:14px">
<li style="display:flex;flex-direction:column;gap:2px"><span class="k">12/09/2026 · courriel automatique</span><span>BALU du pôle domaine informée de la saisine du tribunal</span></li>
<li style="display:flex;flex-direction:column;gap:2px"><span class="k">21/08/2026 · courriel automatique</span><span>BAJC invité à ouvrir la phase judiciaire</span></li>
</ul>
<p style="margin:0;font-size:13px;color:#56636B">La régularisation reste possible à tout moment ; elle est validée par le pôle domaine.</p>
</section>
</main>
</div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
const cur = 6;
const labels = ['Constat','Caractérisation','Avertissement','COSTU','PV de grande voirie','Tribunal et suites'];
const steps = labels.map((label, i) => { const n = i + 1; const done = n < cur, now = n === cur;
return { n, label, state: done ? 'faite' : now ? 'en cours' : 'à venir', aria: now ? 'step' : 'false',
bar: 'height:6px;border-radius:3px;background:' + (done ? '#1A5A85' : now ? '#E08A2E' : '#C9D1D5'),
labelStyle: 'font-size:14px;font-weight:' + (now ? '700' : '500') + ';color:' + (n > cur ? '#56636B' : '#13212B') }; });
return { steps };
}
}
</script>
</body>
</html>
